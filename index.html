<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta DO Construcciones</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
    form { background: #f5f5f5; padding: 20px; border-radius: 8px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
    button { width: 100%; padding: 12px; background: #333; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #555; }
    .success { display: none; text-align: center; color: green; }
  </style>
</head>
<body>
  <h1>DO Construcciones</h1>
  <form id="formularioConsulta">
    <div class="form-group">
      <label>Nombre *</label>
      <input type="text" name="nombre" required>
    </div>
    <div class="form-group">
      <label>WhatsApp *</label>
      <input type="text" name="telefono" required>
    </div>
    <div class="form-group">
      <label>Tipo de proyecto *</label>
      <select name="tipo" required>
        <option>Ampliación de casa existente</option>
        <option>Casa nueva desde cero</option>
        <option>Remodelación</option>
        <option>Consultoría técnica</option>
      </select>
    </div>
    <div class="form-group">
      <label>Metros cuadrados *</label>
      <select name="m2" required>
        <option>Menos de 30 m²</option>
        <option>30 a 60 m²</option>
        <option>60 a 100 m²</option>
        <option>Más de 100 m²</option>
      </select>
    </div>
    <div class="form-group">
      <label>¿Tienes terreno? *</label>
      <select name="terreno" required>
        <option>Sí, tengo terreno o casa propia</option>
        <option>No, necesito asesoramiento</option>
      </select>
    </div>
    <div class="form-group">
      <label>¿De qué zona sos? *</label>
      <select name="zona" required>
        <option>Pergamino</option>
        <option>Zona cercana</option>
        <option>Otra provincia</option>
      </select>
    </div>
    <div class="form-group">
      <label>¿Cuándo querés empezar? *</label>
      <select name="plazo" required>
        <option>El próximo mes</option>
        <option>En 2 a 3 meses</option>
        <option>En 6 meses o más</option>
      </select>
    </div>
    <div class="form-group">
      <label>Notas adicionales</label>
      <textarea name="notas"></textarea>
    </div>
    <button type="submit">Enviar consulta</button>
  </form>
  <div id="successMsg" class="success">
    <h2>¡Consulta recibida!</h2>
    <p>Nos pondremos en contacto a la brevedad.</p>
  </div>

  <script>
    const SCRIPT_URL_NEXT = 'https://dogestion.vercel.app/api/formulario';
    const SCRIPT_URL_SHEETS = 'https://script.google.com/macros/s/AKfycbzB9_nqB7Nv0UR-nElyZR-JtChx4jUOFvFh7uzDald349wTeu0jy5P4WGdf-FV2XZcDqw/exec';

    document.getElementById('formularioConsulta').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const data = Object.fromEntries(formData);

      try {
        await fetch(SCRIPT_URL_NEXT, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
        await fetch(SCRIPT_URL_SHEETS, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
        e.target.style.display = 'none';
        document.getElementById('successMsg').style.display = 'block';
      } catch(err) { console.error(err); }
    });
  </script>
</body>
</html>
